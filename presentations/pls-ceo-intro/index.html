<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Digital PLS院方研讨会</title>
  <style>
    :root{color-scheme:dark;--navy:#0f2f5d;--gold:#e6aa16;--red:#ed1b24;--panel:#13243a;--muted:#aebbd0}
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#07111f;color:#fff}
    body{display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}
    header{height:64px;display:flex;align-items:center;gap:16px;padding:0 22px;background:#0b1728;border-bottom:1px solid #25354b}
    header strong{font-size:18px;white-space:nowrap}
    header span{color:var(--muted);font-size:14px}
    .spacer{flex:1}
    button,a{font:inherit}
    .icon,.download{height:38px;min-width:38px;border:1px solid #34465e;background:#14243a;color:#fff;display:inline-grid;place-items:center;cursor:pointer;text-decoration:none}
    .icon:hover,.icon:focus-visible,.download:hover,.download:focus-visible{border-color:var(--gold);outline:none}
    .download{padding:0 14px;gap:8px;grid-auto-flow:column}
    main{min-height:0;display:grid;grid-template-columns:1fr;position:relative}
    .stage{min-height:0;display:grid;place-items:center;padding:22px 24px 12px}
    .slide-frame{position:relative;width:min(100%,calc((100vh - 146px)*16/9));aspect-ratio:16/9;background:#fff;box-shadow:0 24px 70px rgba(0,0,0,.45)}
    .slide-frame img{display:block;width:100%;height:100%;object-fit:contain}
    .nav-zone{position:absolute;top:0;bottom:0;width:16%;border:0;background:transparent;cursor:pointer}
    .nav-zone.prev{left:0}.nav-zone.next{right:0}
    .nav-zone:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
    .notes{position:absolute;right:24px;top:22px;bottom:12px;width:min(390px,36vw);background:rgba(11,23,40,.97);border:1px solid #34465e;padding:24px;overflow:auto;transform:translateX(calc(100% + 32px));transition:transform .2s ease;z-index:5}
    .notes.open{transform:translateX(0)}
    .notes h2{margin:0 0 14px;font-size:19px;color:var(--gold)}
    .notes p{font-size:16px;line-height:1.75;color:#e8eef7;white-space:pre-line}
    footer{height:70px;display:flex;align-items:center;gap:14px;padding:0 22px;background:#0b1728;border-top:1px solid #25354b}
    .progress{height:4px;flex:1;background:#26384f;position:relative}
    .progress span{position:absolute;inset:0 auto 0 0;background:var(--gold);width:6.25%}
    .counter{min-width:72px;text-align:center;font-variant-numeric:tabular-nums}
    .thumbs{position:fixed;inset:64px 0 70px;background:rgba(4,10,18,.97);padding:26px;overflow:auto;display:none;z-index:8}
    .thumbs.open{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));align-content:start;gap:18px}
    .thumb{border:2px solid transparent;background:#111f31;padding:0;cursor:pointer;position:relative}
    .thumb.active{border-color:var(--gold)}
    .thumb img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
    .thumb span{position:absolute;left:8px;bottom:7px;background:rgba(0,0,0,.72);padding:3px 7px;color:#fff}
    @media(max-width:760px){
      header{height:56px;padding:0 10px;gap:8px}header span{display:none}header strong{font-size:15px}
      .download{padding:0 10px;font-size:14px}.stage{padding:10px}
      footer{height:60px;padding:0 10px}.notes{inset:56px 0 60px auto;width:92vw;top:0;bottom:0;right:0}
      .thumbs{inset:56px 0 60px;padding:12px}.thumbs.open{grid-template-columns:repeat(2,1fr);gap:10px}
    }
  </style>
</head>
<body>
  <header>
    <strong>Digital PLS院方研讨会</strong>
    <span id="slideTitle"></span>
    <div class="spacer"></div>
    <button class="icon" id="thumbButton" type="button" title="幻灯片目录" aria-label="幻灯片目录">☷</button>
    <button class="icon" id="notesButton" type="button" title="讲者提示" aria-label="讲者提示">▤</button>
    <button class="icon" id="fullscreenButton" type="button" title="全屏播放" aria-label="全屏播放">⛶</button>
    <a class="download" href="../../downloads/强生眼力健_Digital_PLS院方研讨会30分钟介绍PPT.pptx" download><span aria-hidden="true">↓</span>下载PPT</a>
  </header>
  <main>
    <section class="stage" aria-live="polite">
      <div class="slide-frame">
        <img id="slideImage" alt="">
        <button class="nav-zone prev" id="prevZone" type="button" aria-label="上一页"></button>
        <button class="nav-zone next" id="nextZone" type="button" aria-label="下一页"></button>
      </div>
    </section>
    <aside class="notes" id="notesPanel" aria-label="讲者提示">
      <h2>讲者提示</h2>
      <p id="notesText"></p>
    </aside>
  </main>
  <footer>
    <button class="icon" id="prevButton" type="button" title="上一页" aria-label="上一页">‹</button>
    <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>
    <span class="counter" id="counter"></span>
    <button class="icon" id="nextButton" type="button" title="下一页" aria-label="下一页">›</button>
  </footer>
  <section class="thumbs" id="thumbPanel" aria-label="幻灯片目录"></section>
  <script>
    const slides = [
      ["Digital PLS体系建设","患者的目标已经从视力表延伸到阅读、工作、驾驶和生活。今天讨论医院如何把这些目标转化为稳定、可信、可追踪的专业服务。\n\n合规提示：本次不是产品宣讲，不承诺疗效、手术量、收入或患者转化。"],
      ["CEO需要回答的五个问题","请院长先选一个最想讨论的问题，后面的内容都会回到这五个判断。"],
      ["PLS晶状体卓越诊疗体系","先讲中文名称和医院能力，再说明医疗边界。白内障和CLE/RLE共享能力系统，但适应证、替代方案与风险收益判断必须分别把关。"],
      ["患者目标已经走出视力表","把变化讲成院方能够观察到的患者问题和组织问题，不使用未经核实的市场数字。"],
      ["患者愿意为哪一种价值作出选择","依次解释生活目标、方案理解、交付信任、自主决定和术后负责。"],
      ["PLS给医院带来的价值","经营价值必须放在患者价值之后。不要把自费比例或某一产品使用量作为唯一成功指标。"],
      ["PLS给医生和团队带来的价值","重点是临床信心、可信团队输入和可复盘的专业成长，不把医生价值表述为商业转化。"],
      ["PLS合作的三条底线","主动讲清眼力健的商业身份和合作边界。透明比回避更能建立管理层信任。"],
      ["六大支柱","六大支柱是医院后台能力系统，可根据院方现状选择重点展开。"],
      ["IDEAL患者共同决策五步","共同决策的完成标准不是团队讲完了，而是患者能用自己的话说出目标、局限、替代方案、费用属性和术后联系路径。"],
      ["两条路径，共享同一条医学底线","不要把基础医保路径与PLS路径讲成医疗质量高低。两条路径必须共享安全、质量和尊重患者的底线。"],
      ["一家医院的七步建设路线","每一步都有明确输出。医院完成本阶段的责任、行动和证据后，再进入下一步。"],
      ["第1至30天：建立最小可运行流程","前30天不追求一次铺开全部工作。先跑通一条完整路径，让团队知道如何协作。"],
      ["第31至60天：小规模试运行","试运行的目的是发现问题。出现医学红线、风险复核缺失或患者理解不足时，应暂停并回到临床判断。"],
      ["第61至90天：复盘、固化、再决定","CEO先看医疗质量、患者价值和服务体验，再看经营健康。经营指标不能替代前三类结果。"],
      ["下一步","邀请院方选择一个具体院区或门诊场景进入诊断，不把下一步说成采购或销量目标。"]
    ];
    let index = Math.max(0, Math.min(slides.length - 1, Number(new URLSearchParams(location.search).get('slide')) - 1 || 0));
    const image = document.querySelector('#slideImage');
    const title = document.querySelector('#slideTitle');
    const notes = document.querySelector('#notesText');
    const counter = document.querySelector('#counter');
    const bar = document.querySelector('#progressBar');
    const notesPanel = document.querySelector('#notesPanel');
    const thumbPanel = document.querySelector('#thumbPanel');
    function src(i){return 'slides/slide-' + String(i + 1).padStart(2,'0') + '.png'}
    slides.forEach((slide,i)=>{const preload=new Image();preload.src=src(i);const button=document.createElement('button');button.className='thumb';button.type='button';button.innerHTML='<img src="'+src(i)+'" alt=""><span>'+(i+1)+'</span>';button.addEventListener('click',()=>{show(i);thumbPanel.classList.remove('open')});thumbPanel.appendChild(button)});
    function show(next){
      index=(next+slides.length)%slides.length;
      image.src=src(index);image.alt='第'+(index+1)+'页：'+slides[index][0];
      title.textContent=slides[index][0];notes.textContent=slides[index][1];
      counter.textContent=(index+1)+' / '+slides.length;bar.style.width=((index+1)/slides.length*100)+'%';
      thumbPanel.querySelectorAll('.thumb').forEach((el,i)=>el.classList.toggle('active',i===index));
      history.replaceState(null,'','?slide='+(index+1));
    }
    function previous(){show(index-1)} function next(){show(index+1)}
    document.querySelector('#prevButton').addEventListener('click',previous);
    document.querySelector('#prevZone').addEventListener('click',previous);
    document.querySelector('#nextButton').addEventListener('click',next);
    document.querySelector('#nextZone').addEventListener('click',next);
    document.querySelector('#notesButton').addEventListener('click',()=>notesPanel.classList.toggle('open'));
    document.querySelector('#thumbButton').addEventListener('click',()=>thumbPanel.classList.toggle('open'));
    document.querySelector('#fullscreenButton').addEventListener('click',()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen());
    document.addEventListener('keydown',event=>{
      if(['ArrowRight','PageDown',' '].includes(event.key)){event.preventDefault();next()}
      if(['ArrowLeft','PageUp'].includes(event.key)){event.preventDefault();previous()}
      if(event.key==='Home')show(0);if(event.key==='End')show(slides.length-1);
      if(event.key.toLowerCase()==='n')notesPanel.classList.toggle('open');
      if(event.key==='Escape')thumbPanel.classList.remove('open');
    });
    show(index);
  </script>
</body>
</html>
